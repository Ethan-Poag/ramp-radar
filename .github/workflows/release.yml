name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: "" }
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-15-intel, args: "--target x86_64-apple-darwin" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libdbus-1-dev libssl-dev pkg-config libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: web
      # Unsigned builds. For signed/notarised releases add the Apple / Windows certificate secrets
      # described in https://v2.tauri.app/distribute/ and pass them as env to tauri-action.
      # projectPath is the repo root so the action finds src-tauri/; beforeBuildCommand
      # also runs from that root (`npm --prefix web …` in tauri.conf.json).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ramp Radar ${{ github.ref_name }}"
          releaseDraft: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  # Version-independent names for README / install.sh one-click links.
  # Original Tauri assets (and latest.json + .sig) stay as uploaded so the
  # desktop updater keeps working.
  stable-download-names:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Upload stable-named installer aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag=${GITHUB_REF_NAME}
          mkdir -p aliases
          cd aliases
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern 'Ramp.Radar*'
          pick() {
            # One file matching glob, never a .sig.
            set -- $1
            if [ $# -ne 1 ] || [ ! -f "$1" ]; then
              echo "expected exactly one file for pattern, got: $*" >&2
              ls -la >&2
              exit 1
            fi
            case $1 in *.sig) echo "refusing signature file $1" >&2; exit 1 ;; esac
            echo "$1"
          }
          upload() {
            src=$1 dest=$2
            cp "$src" "$dest"
            gh release upload "$tag" "$dest" -R "$GITHUB_REPOSITORY" --clobber
            echo "aliased $src -> $dest"
          }
          upload "$(pick 'Ramp.Radar_*_x64-setup.exe')" RampRadar-windows-x64-setup.exe
          upload "$(pick 'Ramp.Radar_*_x64_en-US.msi')" RampRadar-windows-x64.msi
          upload "$(pick 'Ramp.Radar_*_aarch64.dmg')" RampRadar-macos-apple-silicon.dmg
          upload "$(pick 'Ramp.Radar_*_x64.dmg')" RampRadar-macos-intel.dmg
          upload "$(pick 'Ramp.Radar_*_amd64.AppImage')" RampRadar-linux-x86_64.AppImage
          upload "$(pick 'Ramp.Radar_*_amd64.deb')" RampRadar-linux-amd64.deb
          upload "$(pick 'Ramp.Radar-*.x86_64.rpm')" RampRadar-linux-x86_64.rpm

  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, name: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --release -p ramp-radar-server
      - name: Package
        run: |
          mkdir dist
          cp target/release/ramp-radar-server dist/
          cp deploy/ramp-radar.service README.md LICENSE dist/
          tar -C dist -czf ramp-radar-server-${{ matrix.name }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: "server-${{ matrix.name }}", path: "ramp-radar-server-*.tar.gz" }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: ramp-radar-server-*.tar.gz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
