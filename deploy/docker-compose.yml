services:
  ramp-radar:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      # Strongly recommended when exposed on your LAN:
      RR_ACCESS_TOKEN: "${RR_ACCESS_TOKEN:-}"
    volumes: ["rr-data:/data"]
volumes:
  rr-data:
