[package]
name = "ramp-radar-desktop"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Ramp Radar desktop app (Tauri 2 shell around the shared Rust core and web UI)"
default-run = "ramp-radar-desktop"

# Standalone workspace: the root workspace (core + server) builds without GTK/WebKit.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ramp-radar-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
